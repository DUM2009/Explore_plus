<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Code of Life | Explore+</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mission-styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">Explore+</div>
        <nav>
            <a href="index.html">Início</a>
            <a href="missions.html">Missões</a>
            <a href="about.html">Sobre</a>
            <button onclick="window.location.href='perfil.html'">Ir para Perfil</button>
        </nav>
    </header>

    <!-- Main Mission Container -->
    <div class="mission-container">
        <!-- Progress Section -->
        <div class="mission-header">
            <div class="header-content">
                <button class="back-button" onclick="window.location.href='missions.html'">&larr; Back</button>
                <div class="mission-title-section">
                    <h1 id="missionTitle"></h1>
                    <p id="missionDescription"></p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-info">
                    <span class="progress-label">Progress</span>
                    <span class="progress-percent" id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="section-counter">
                    <span id="sectionCounter">0/6 Sections</span>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="mission-content">
            <!-- Sections Container -->
            <div class="sections-wrapper" id="sectionsWrapper"></div>
        </div>
    </div>

    <!-- XP Toast Notification -->
    <div class="xp-toast" id="xpToast">
        <span class="xp-icon">⭐</span>
        <span class="xp-text" id="xpText">+50 XP</span>
    </div>

    <!-- Correct Answer Animation -->
    <div class="correct-animation" id="correctAnimation">
        <div class="celebration">
            <div class="confetti">🎉</div>
            <div class="confetti">✨</div>
            <div class="confetti">🎊</div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="auth.js"></script>
    <script src="mission-data.js"></script>
    <script src="profile-xp.js"></script>
    <script src="mission.js"></script>

<style>
.guide-option.correct {
    background-color: #d4edda;
    border-color: #28a745;
}

.guide-option.incorrect {
    background-color: #f8d7da;
    border-color: #dc3545;
}

.guide-option:disabled {
    cursor: not-allowed;
    opacity: 0.85;
}
</style>

<!-- From Uiverse.io by gharsh11032000 --> 
<div class="tabs">
  <div class="tab-group">
    <input checked="" id="tab1" name="tab" value="1" type="radio" />
    <label for="tab1">
      <span>1</span>
    </label>
  </div>
  <div class="tab-group">
    <input id="tab2" name="tab" value="2" type="radio" />
    <label for="tab2">
      <span>2</span>
    </label>
  </div>
  <div class="tab-group">
    <input id="tab3" name="tab" value="3" type="radio" />
    <label for="tab3">
      <span>3</span>
    </label>
  </div>
</div>

</body>
</html>
