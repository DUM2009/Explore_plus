<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>O meu Perfil | Explore+</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="profile-header">

<div class="logo">
Explore+
</div>

<nav>
<a href="index.html">Início</a>
<a href="missions.html">Missões</a>
<a href="about.html">Sobre</a>
</nav>

<button class="sidebar-toggle" id="sidebarToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="profileSidebar">
<span></span>
<span></span>
<span></span>
</button>

</header>

<div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

<section class="profile-layout">

<aside class="profile-sidebar" id="profileSidebar" aria-hidden="true">
<div class="profile-sidebar-brand">
<div class="logo">
            <img src="assets/images/Logo.png" alt="Logotipo Explore+">
        </div>
</div>

<nav class="profile-sidebar-nav">
<a href="perfil.html">Perfil</a>
<a href="missions.html">Missões</a>
<a href="Testes.html">Testes</a>
<a href="dicionario.html" id="dictionaryNavItem">Livro do explorador</a>
<a href="Resumos.html">Resumos</a>
<a href="Conquistas.html" id="dictionaryNavItem">Conquistas</a>
<a href="about.html">Sobre</a>
</nav>
</aside>

<div class="profile-main-shell">
<div class="profile-content">
<div class="profile-summary-card">

    <div class="profile-user-info">
        <div class="profile-avatar-circle">
            <span>👤</span>
        </div>

        <div>
            <p class="profile-kicker">O meu perfil</p>
            <h1 id="nomeAluno">Olá, Aprendiz</h1>
            <h2 id="nivelAluno">Nível 0</h2>
        </div>
    </div>

    <div class="profile-xp-info">
        <div class="profile-xp-header">
            <span>Experiência</span>
            <strong id="xpAluno">0 XP</strong>
        </div>

        <div class="barra profile-progress-bar">
            <div class="progresso" id="xpProgressBar"></div>
        </div>

        <p id="xpNextLevelText">Próximo nível aos 100 XP</p>
    </div>

    <div class="profile-biology">

        <div class="profile-biology-heading">
            <div>
                <p class="profile-kicker">Explora</p>
                <h2>Biologia</h2>
            </div>
        </div>

        <div class="profile-subject-progress">

            <div class="profile-subject">
                <div class="profile-subject-info">
                    <span>Fotossíntese</span>
                    <strong data-mission-progress-value="photosynthesis">0%</strong>
                </div>

                <div class="profile-subject-bar">
                    <div data-mission-progress-bar="photosynthesis" style="width: 0%;"></div>
                </div>
            </div>

            <div class="profile-subject">
                <div class="profile-subject-info">
                    <span>Mitose</span>
                    <strong data-mission-progress-value="mitosis">0%</strong>
                </div>

                <div class="profile-subject-bar">
                    <div data-mission-progress-bar="mitosis" style="width: 0%;"></div>
                </div>
            </div>

            <div class="profile-subject">
                <div class="profile-subject-info">
                    <span>Meiose</span>
                    <strong data-mission-progress-value="meiosis">0%</strong>
                </div>

                <div class="profile-subject-bar">
                    <div data-mission-progress-bar="meiosis" style="width: 0%;"></div>
                </div>
            </div>

        </div>

    </div>

</div>

<div class="acoes-card profile-action-card">
<h2>Explorar</h2>
<button onclick="window.location.href='missions.html'">Continuar a aprender</button>
<button id="deleteAccountBtn" type="button">Eliminar conta</button>
<button id="logoutBtn">Terminar sessão</button>
</div>
</div>
</div>

</section>

<script src="profile-xp.js"></script>
<script type="module" src="perfil.js"></script>



</body>

</html>
