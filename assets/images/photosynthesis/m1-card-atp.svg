<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf9f4"/>
      <stop offset="100%" stop-color="#d8f2e6"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#69c79b"/>
      <stop offset="100%" stop-color="#2f9f6a"/>
    </linearGradient>
    <linearGradient id="rotor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc98e"/>
      <stop offset="100%" stop-color="#1f8a5b"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8be0b7"/>
      <stop offset="100%" stop-color="#28a36a"/>
    </linearGradient>
    <style>
      .label {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        fill: #1f4b37;
      }

      .hplus {
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        font-size: 15px;
        fill: #0c7d4e;
        font-weight: 700;
      }
    </style>
  </defs>

  <rect width="960" height="420" rx="26" fill="url(#bg)"/>
  <rect x="34" y="38" width="892" height="344" rx="20" fill="#ffffff" stroke="#b8dfca" stroke-width="3"/>

  <text x="94" y="86" class="label" font-size="24" font-weight="700">ATP sintase (turbina)</text>
  <text x="613" y="86" class="label" font-size="24" font-weight="700">Formacao de NADPH</text>

  <rect x="82" y="146" width="340" height="128" rx="20" fill="url(#tube)" opacity="0.2"/>
  <rect x="82" y="170" width="340" height="80" rx="16" fill="url(#tube)" opacity="0.35"/>

  <g>
    <text x="96" y="167" class="hplus">H+</text>
    <text x="136" y="167" class="hplus">H+</text>
    <text x="176" y="167" class="hplus">H+</text>
    <text x="216" y="167" class="hplus">H+</text>
    <text x="256" y="167" class="hplus">H+</text>
  </g>

  <g transform="translate(270 210)">
    <circle cx="0" cy="0" r="72" fill="#e7f7ee" stroke="#2b9f69" stroke-width="6"/>
    <g>
      <path d="M0 -60 L16 -10 L0 0 L-16 -10 Z" fill="url(#rotor)"/>
      <path d="M52 30 L8 12 L14 -2 L58 16 Z" fill="url(#rotor)"/>
      <path d="M-48 34 L-58 16 L-14 -2 L-8 12 Z" fill="url(#rotor)"/>
      <circle cx="0" cy="-52" r="5" fill="#ffd24d"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <circle cx="0" cy="0" r="22" fill="#1f8a5b"/>
    <circle cx="0" cy="0" r="8" fill="#dff5e9"/>
  </g>

  <path d="M352 210 C420 210, 470 210, 532 210" fill="none" stroke="url(#energy)" stroke-width="8" stroke-linecap="round"/>
  <polygon points="532,210 514,198 514,222" fill="#2ca66c"/>
  <text x="406" y="194" class="label" font-size="17" font-weight="700">energia</text>

  <g>
    <circle cx="330" cy="210" r="6" fill="#74d6a5" opacity="0">
      <animate attributeName="cx" values="330;550" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="210" r="6" fill="#5cc996" opacity="0">
      <animate attributeName="cx" values="330;550" dur="2.2s" begin="0.65s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.2s" begin="0.65s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="210" r="6" fill="#3ab278" opacity="0">
      <animate attributeName="cx" values="330;550" dur="2.2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(582 148)">
    <rect x="0" y="0" width="316" height="124" rx="18" fill="#f3fbf7" stroke="#b7e5cd" stroke-width="3"/>
    <text x="18" y="44" class="label" font-size="28" font-weight="700">NADP+</text>
    <text x="116" y="44" class="label" font-size="26" font-weight="700">+ H+ + 2e-</text>
    <text x="18" y="90" class="label" font-size="24" font-weight="700">-></text>
    <text x="58" y="90" class="label" font-size="34" font-weight="800" fill="#16724a">NADPH
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <circle cx="760" cy="210" r="44" fill="#8de3b9" opacity="0.25">
    <animate attributeName="r" values="34;48;34" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="700" cy="192" r="4" fill="#2ca66c" opacity="0">
    <animate attributeName="cx" values="700;742" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="192;206" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="716" cy="236" r="4" fill="#2ca66c" opacity="0">
    <animate attributeName="cx" values="716;760" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="236;214" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <text x="96" y="330" class="label" font-size="18">Fluxo de H+ gira a ATP sintase para produzir ATP.</text>
  <text x="560" y="326" class="label" font-size="16">
    <tspan x="560" dy="0">Eletrões e H+ reduzem NADP+</tspan>
    <tspan x="560" dy="22">e formam NADPH.</tspan>
  </text>
</svg>