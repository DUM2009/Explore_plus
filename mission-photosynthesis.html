<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotossíntese | Explore+</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mission-styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">Explore+</div>
        <nav>
            <a href="index.html">Início</a>
            <a href="missions.html">Missões</a>
            <a href="about.html">Sobre</a>
        </nav>
    </header>

    <!-- Main Mission Container -->
    <div class="mission-container">
        <div id="missionNotice" class="locked-message" style="display:none; margin-bottom:16px;"></div>

        <!-- Progress Section -->
        <div class="mission-header">
            <div class="header-content">
                <button class="back-button" onclick="window.location.href='missions.html'">&larr; Voltar</button>
                <div class="mission-title-section">
                    <h1 id="missionTitle"></h1>
                    <p id="missionDescription"></p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-info">
                    <span class="progress-label">Progresso</span>
                    <span class="progress-percent" id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="section-counter">
                    <span id="sectionCounter">0/3 Secções</span>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="mission-content">
            <!-- Sections Container -->
            <div class="sections-wrapper" id="sectionsWrapper"></div>
        </div>
    </div>

    <!-- XP Toast Notification -->
    <div class="xp-toast" id="xpToast">
        <span class="xp-icon">⭐</span>
        <span class="xp-text" id="xpText">+50 XP</span>
    </div>

    <!-- Correct Answer Animation -->
    <div class="correct-animation" id="correctAnimation">
        <div class="celebration">
            <div class="confetti">🎉</div>
            <div class="confetti">✨</div>
            <div class="confetti">🎊</div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="auth.js"></script>
    <script src="mission-data-photosynthesis.js"></script>
    <script src="profile-xp.js"></script>
    <script src="mission.js"></script>
    <script>
        // Override startFinalQuiz to redirect to the gold test page instead of in-page quiz
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('locked') === 'gold') {
                const notice = document.getElementById('missionNotice');
                if (notice) {
                    notice.style.display = 'block';
                    notice.textContent = '🔒 Termina as 3 missões do capítulo para desbloquear o Teste de Ouro.';
                }
            }

            const applyGoldTestOverride = () => {
                if (typeof missionSystem === 'undefined' || !missionData.goldTestUrl) {
                    return false;
                }

                missionSystem.startFinalQuiz = function () {
                    const message = 'Ganhaste o emblema de prata 🥈\nQueres tentar ganhar o emblema de ouro? Resolve o teste final do capítulo (20 perguntas) e consegue 17 ou mais valores.';
                    const proceed = window.confirm(message);

                    if (proceed) {
                        sessionStorage.setItem('allow_goldtest_photosynthesis', '1');
                        window.location.href = missionData.goldTestUrl;
                    }
                };

                return true;
            };

            if (applyGoldTestOverride()) {
                return;
            }

            window.addEventListener('explore:auth-changed', applyGoldTestOverride, { once: true });

            let attempts = 0;
            const attachTimer = setInterval(() => {
                attempts += 1;
                if (applyGoldTestOverride() || attempts > 20) {
                    clearInterval(attachTimer);
                }
            }, 100);
        });
    </script>
</body>
</html>
