<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="Outfit, Arial, sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c92a2a"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1c7ed6"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1f8a5b"/></marker>
  </defs>
  <rect width="640" height="390" rx="14" fill="#ffffff"/>
  <!-- estrada -->
  <rect x="20" y="310" width="600" height="38" rx="4" fill="#6b7280"/>
  <line x1="20" y1="310" x2="620" y2="310" stroke="#374151" stroke-width="3"/>
  <!-- carro visto de trás -->
  <rect x="204" y="274" width="26" height="36" rx="4" fill="#1f2937"/>
  <rect x="270" y="274" width="26" height="36" rx="4" fill="#1f2937"/>
  <path d="M212 224 L226 190 H274 L288 224 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <path d="M222 220 L233 196 H267 L278 220 Z" fill="#bfdbfe"/>
  <rect x="190" y="222" width="120" height="62" rx="12" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <rect x="196" y="236" width="18" height="11" rx="2" fill="#fde047"/>
  <rect x="286" y="236" width="18" height="11" rx="2" fill="#fde047"/>
  <rect x="238" y="262" width="24" height="12" rx="2" fill="#f3f4f6"/>
  <!-- direção do centro da curva -->
  <line x1="312" y1="252" x2="545" y2="252" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="560" cy="252" r="7" fill="#111827"/>
  <text x="560" y="232" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">centro</text>
  <text x="560" y="276" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">da curva</text>
  <!-- forças no centro de massa -->
  <circle cx="250" cy="252" r="5" fill="#111827"/>
  <g stroke-width="5" stroke-linecap="round">
    <line x1="250" y1="252" x2="250" y2="308" stroke="#ffffff" stroke-width="9"/>
    <line x1="250" y1="252" x2="250" y2="308" stroke="#c92a2a" marker-end="url(#p)"/>
    <line x1="250" y1="252" x2="250" y2="186" stroke="#ffffff" stroke-width="9"/>
    <line x1="250" y1="252" x2="250" y2="186" stroke="#1c7ed6" marker-end="url(#n)"/>
  </g>
  <!-- atrito estático, no contacto pneu-estrada -->
  <line x1="296" y1="304" x2="440" y2="304" stroke="#1f8a5b" stroke-width="6" stroke-linecap="round" marker-end="url(#a)"/>
  <!-- legendas -->
  <text x="250" y="170" font-size="17" font-weight="800" fill="#1c7ed6" text-anchor="middle">N (reação normal)</text>
  <text x="250" y="335" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">P = m g (peso)</text>
  <text x="368" y="288" font-size="17" font-weight="800" fill="#1f8a5b" text-anchor="middle">F atrito estático</text>
  <text x="320" y="372" font-size="16" font-weight="600" fill="#374151" text-anchor="middle">Curva plana: o atrito estático é a força que aponta para o centro e curva o carro.</text>
</svg>
