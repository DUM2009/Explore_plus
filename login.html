<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Explore+</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">
      Explore+
    </div>
    <nav>
      <a href="index.html">Início</a>
      <a href="about.html">Sobre</a>
    </nav>
  </header>

  <section class="login-page">
    <div class="light-login-shell">
      <div class="light-login-card">
        <div class="light-login-header">
          <div class="brand-badge" aria-label="Explore+ logo">
            <img src="assets/images/Logo.png" alt="Logo Explore+" />
          </div>
          <h2>Continua a explorar!</h2>
          <p>Entra na tua conta</p>
        </div>

        <form class="light-login-form" autocomplete="on">
          <div class="form-group">
            <label for="emailLogin">Email</label>
            <div class="input-shell">
              <input id="emailLogin" type="email" placeholder="Inserir email" />
            </div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="passwordLogin">Password</label>
              <a href="#" class="forgot-link">Esqueces-te a password?</a>
            </div>
            <div class="input-shell">
              <input id="passwordLogin" type="password" placeholder="••••••••" />
            </div>
          </div>

          <button id="entrarBtn" type="button" class="login-button">Entrar</button>

          <div class="divider">
            <span>continuar com</span>
          </div>

          <div class="social-grid">
            <button type="button" class="social-button google-button" aria-label="Entrar com Google">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              <span>Google</span>
            </button>

            <button type="button" class="social-button apple-button" aria-label="Entrar com Apple">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15.293 11.577c0-2.164 1.764-3.207 1.845-3.258-.997-1.467-2.542-1.668-3.088-1.691-1.316-.133-2.572.775-3.245.775-.673 0-1.71-.755-2.814-.735-1.451.021-2.782.844-3.52 2.146-1.505 2.609-.384 6.462 1.076 8.572.715 1.038 1.566 2.205 2.688 2.162 1.078-.043 1.486-.697 2.792-.697 1.306 0 1.672.697 2.813.675 1.163-.021 1.897-1.055 2.607-2.101.812-1.183 1.146-2.33 1.164-2.389-.025-.009-2.217-.854-3.538-2.335Zm-2.144-6.59c.59-.717 1-1.711.89-2.707-.857.035-1.891.573-2.507 1.291-.553.64-1.04 1.663-.909 2.643.963.075 1.945-.487 2.526-1.227Z" fill="currentColor"/>
              </svg>
              <span>Apple</span>
            </button>
          </div>
        </form>

        <p class="bottom-signup">
          Não tens conta?
          <a href="signup.html">Criar conta</a>
        </p>
      </div>
    </div>
  </section>

  <script type="module" src="script.js"></script>
  <script type="module" src="auth.js"></script>
</body>

</html>
