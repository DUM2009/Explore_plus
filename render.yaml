services:
  - type: web
    name: explore-plus
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python meu_site/manage.py collectstatic --noinput && python meu_site/manage.py migrate && (python meu_site/manage.py createsuperuser --noinput || true)"
    startCommand: "gunicorn meu_site.wsgi:application --chdir meu_site"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ANTHROPIC_API_KEY
        sync: false
      # Stripe (assinatura SuperExplore) — chave secreta, Price ID e segredo de
      # assinatura do webhook, todos definidos manualmente no dashboard do
      # Render (Environment tab), nunca aqui.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      # Neon Postgres connection string — set this manually in the Render
      # dashboard (Environment tab), never committed here. Without it,
      # settings.py falls back to SQLite on Render's own (ephemeral) disk.
      - key: DATABASE_URL
        sync: false
      # Google OAuth (login/signup "Continuar com Google") — Client ID and
      # Secret from Google Cloud Console (APIs & Services > Credentials >
      # OAuth client ID, type "Web application"), set manually in the
      # Render dashboard, never committed here. Authorized redirect URI to
      # register there: https://<este-domínio>.onrender.com/accounts/google/login/callback/
      # Without these, settings.py falls back to empty strings and Google
      # rejects the request with "Missing required parameter: client_id".
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Email de "recuperar password" (ver enviar_email_brevo em views.py) —
      # mandado pela API HTTP da Brevo (brevo.com), não por SMTP direto: o
      # Render bloqueia ligações de saída em smtp.gmail.com:587 (e portas
      # SMTP em geral) nos planos mais baratos, o que pendura o pedido até
      # o worker do gunicorn ser morto, sem dar um erro normal. Sem
      # BREVO_API_KEY definida, o email simplesmente não chega a sair (a
      # página continua a funcionar). Para configurar:
      # 1. Cria conta grátis em app.brevo.com (300 emails/dia, sem cartão).
      # 2. Em Senders, Domains & Dedicated IPs, adiciona e verifica o
      #    remetente (ex: exploremore.pt26@gmail.com) — chega um email de
      #    confirmação, não precisa de teres um domínio próprio.
      # 3. Em SMTP & API > API Keys, cria uma chave e usa-a aqui.
      - key: BREVO_API_KEY
        sync: false
      # Used only by `createsuperuser --noinput` above, which reads these
      # three exact env var names itself (Django convention). The `|| true`
      # keeps redeploys from failing once the account already exists.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
