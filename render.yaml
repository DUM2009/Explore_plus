services:
  - type: web
    name: explore-plus
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python meu_site/manage.py collectstatic --noinput && python meu_site/manage.py migrate && (python meu_site/manage.py createsuperuser --noinput || true)"
    startCommand: "gunicorn meu_site.wsgi:application --chdir meu_site"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ANTHROPIC_API_KEY
        sync: false
      # Neon Postgres connection string — set this manually in the Render
      # dashboard (Environment tab), never committed here. Without it,
      # settings.py falls back to SQLite on Render's own (ephemeral) disk.
      - key: DATABASE_URL
        sync: false
      # Used only by `createsuperuser --noinput` above, which reads these
      # three exact env var names itself (Django convention). The `|| true`
      # keeps redeploys from failing once the account already exists.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
