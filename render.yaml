services:
  - type: web
    name: explore-plus
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python meu_site/manage.py collectstatic --noinput && python meu_site/manage.py migrate"
    startCommand: "gunicorn meu_site.wsgi:application --chdir meu_site"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ANTHROPIC_API_KEY
        sync: false
