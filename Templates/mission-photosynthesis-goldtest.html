{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Ouro — Fotossíntese | Explore+</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem('explore-theme') === 'dark') {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (error) {
                // Ignore storage access errors (private browsing) — the page
                // just falls back to light mode.
            }
        })();
    </script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'mission-styles.css' %}">
    <style>
        /* Gold Test specific styles */
        .goldtest-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .goldtest-container .quiz-progress {
            margin: 20px 0;
        }

        .goldtest-container #goldProgressLabel {
            color: #4b5563;
            font-weight: 600;
        }

        .goldtest-container .final-quiz-question h3 {
            margin-top: 8px;
        }

        .goldtest-container .final-quiz-option {
            color: #111111;
        }

        .goldtest-container .final-quiz-option .option-text {
            color: #111111;
        }

        .goldtest-container .final-quiz-option .option-circle {
            color: #111111;
            background: #c8e6c9;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Explore+</div>
        <nav>
            <a href="{% url 'pagina_inicial' %}">Início</a>
            <a href="{% url 'index-missions' %}">Missões</a>
            <a href="{% url 'about' %}">Sobre</a>
            <a href="{% url 'perfil' %}">Perfil</a>
        </nav>

        <div class="header-icon-actions">
            <div class="header-icon-wrapper">
            <button class="header-icon-btn" id="notificationsBtn" type="button" aria-label="Notificações" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell-icon lucide-bell"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
            <span class="header-icon-badge" id="notificationsBadge" hidden>0</span>
            </button>
            <ul class="notifications-panel" id="notificationsPanel" hidden>
                <li class="notifications-empty">Nenhuma notificação</li>
            </ul>
            </div>

            <button class="header-icon-btn theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="Ativar modo escuro" aria-pressed="false">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
            </button>
        </div>
    </header>

    <div class="goldtest-container">
        <div id="goldtest-root"></div>
    </div>

    <script>
        window.exploreCurrentUser = { uid: 'django-{{ request.user.id }}', email: '{{ request.user.email|escapejs }}' };
        window.exploreProgressSyncUrl = '{% url "salvar-progresso-missao" %}';
        window.exploreCsrfToken = '{{ csrf_token }}';
    </script>
    <script src="{% static 'mission-data-photosynthesis.js' %}"></script>
    <script src="{% static 'profile-xp.js' %}"></script>
    <script src="{% static 'goldtest-photosynthesis.js' %}"></script>
    <script>
        function getMissionProgressKey() {
            const user = window.exploreCurrentUser;
            const userKey = user && user.uid
                ? `uid:${user.uid}`
                : (user && user.email ? `email:${String(user.email).toLowerCase()}` : 'guest');

            return `mission_${userKey}_${missionData?.id || 'photosynthesis'}`;
        }

        function runGoldTestAccessGuard() {
            const isSessionAllowed = sessionStorage.getItem('allow_goldtest_photosynthesis') === '1';
            if (isSessionAllowed) {
                sessionStorage.removeItem('allow_goldtest_photosynthesis');
                return;
            }

            const storageKey = getMissionProgressKey();
            const raw = localStorage.getItem(storageKey);
            const requiredSections = new Set(
                Array.isArray(missionData?.sections) ? missionData.sections.map((section) => section.id) : []
            );

            if (!raw) {
                window.location.href = 'mission-photosynthesis.html?locked=gold';
                return;
            }

            try {
                const progress = JSON.parse(raw);
                const completed = Array.isArray(progress.completedSections) ? progress.completedSections : [];
                const validCompletedSections = new Set(completed.filter((id) => requiredSections.has(id)));

                if (!requiredSections.size || validCompletedSections.size !== requiredSections.size) {
                    window.location.href = 'mission-photosynthesis.html?locked=gold';
                }
            } catch (error) {
                window.location.href = 'mission-photosynthesis.html?locked=gold';
            }
        }

        let guardRan = false;
        const guardedRun = () => {
            if (guardRan) return;
            guardRan = true;
            runGoldTestAccessGuard();
        };

        window.addEventListener('explore:auth-changed', guardedRun, { once: true });
        setTimeout(guardedRun, 1200);

    </script>
<script src="nav-tabs.js" defer></script>
<script src="{% static 'header-actions.js' %}" defer></script>
</body>
</html>
