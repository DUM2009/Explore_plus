{% load static %}
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | Explore+</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        .quiz-container {
            max-width: 700px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,.1);
        }
        .quiz-container h1 {
            margin-bottom: 30px;
            color: #1f8a5b;
        }
        .question {
            margin: 20px 0;
            padding: 20px;
            background: #f5f9f7;
            border-radius: 12px;
        }
        .question h3 {
            margin-bottom: 15px;
        }
        .option {
            display: block;
            margin: 0 0 12px 0;
            padding: 12px 15px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s;
            line-height: 1.5;
        }
        .option:hover {
            border-color: #1f8a5b;
            background: #f5f9f7;
            transform: translateX(5px);
        }
        .option:last-child {
            margin-bottom: 0;
        }
        .option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }
        .option input[type="radio"]:checked {
            accent-color: #1f8a5b;
        }
        .quiz-button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #1f8a5b;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }
        .quiz-button:hover {
            background: #166a46;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Explore+</div>
        <nav>
            <a href="{% url 'pagina_inicial' %}">Início</a>
            <a href="{% url 'index-missions' %}">Missões</a>
            <a href="{% url 'about' %}">Sobre</a>
            <a href="{% url 'perfil' %}">Perfil</a>
        </nav>

        <div class="header-icon-actions">
            <div class="header-icon-wrapper">
            <button class="header-icon-btn" id="notificationsBtn" type="button" aria-label="Notificações" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell-icon lucide-bell"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
            <span class="header-icon-badge" id="notificationsBadge" hidden>0</span>
            </button>
            <ul class="notifications-panel" id="notificationsPanel" hidden>
                <li class="notifications-empty">Nenhuma notificação</li>
            </ul>
            </div>

            <button class="header-icon-btn theme-toggle-btn" id="themeToggleBtn" type="button" aria-label="Ativar modo escuro" aria-pressed="false">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
            </button>
        </div>
    </header>

    <div class="quiz-container">
        <h1>🧬 Quiz: O Código da Vida</h1>
        
        <div class="question">
            <h3>Questão 1: O que é ADN?</h3>
            <label class="option">
                <input type="radio" name="q1" value="a"> A) Ácido desoxirribonucleico que contém informação genética
            </label>
            <label class="option">
                <input type="radio" name="q1" value="b"> B) Uma proteína que ajuda na digestão
            </label>
            <label class="option">
                <input type="radio" name="q1" value="c"> C) Uma vitamina essencial para o corpo
            </label>
        </div>

        <div class="question">
            <h3>Questão 2: Quanto por cento de ADN compartilham dois seres humanos?</h3>
            <label class="option">
                <input type="radio" name="q2" value="a"> A) 50%
            </label>
            <label class="option">
                <input type="radio" name="q2" value="b"> B) 99.9%
            </label>
            <label class="option">
                <input type="radio" name="q2" value="c"> C) 75%
            </label>
        </div>

        <div class="question">
            <h3>Questão 3: Onde é armazenado o ADN nas células?</h3>
            <label class="option">
                <input type="radio" name="q3" value="a"> A) No citoplasma
            </label>
            <label class="option">
                <input type="radio" name="q3" value="b"> B) No núcleo
            </label>
            <label class="option">
                <input type="radio" name="q3" value="c"> C) Na mitocôndria
            </label>
        </div>

        <button class="quiz-button" onclick="verificarRespostas()">Submeter Respostas</button>
        <button class="quiz-button" onclick="window.location.href='missions.html'" style="background: #6c757d; margin-top: 10px;">Voltar às Missões</button>
    </div>

    <script>
        function verificarRespostas() {
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
            const q3 = document.querySelector('input[name="q3"]:checked');

            if (!q1 || !q2 || !q3) {
                alert('Por favor, responde a todas as questões!');
                return;
            }

            let corretas = 0;
            if (q1.value === 'a') corretas++;
            if (q2.value === 'b') corretas++;
            if (q3.value === 'b') corretas++;

            let conquistaMensagem = '';
            if (window.ProfileXP) {
                const badgeSource = window.ProfileXP.buildRewardSource('quiz', 'dna:code-of-life');
                const badgeResult = window.ProfileXP.unlockBadgesForCurrentUser(badgeSource);
                if (badgeResult.changed) {
                    conquistaMensagem = '\n\n🏅 Novo emblema desbloqueado: DNA Prateado';
                }
            }

            const percentagem = (corretas / 3) * 100;
            alert(`Pontuação: ${corretas}/3 (${percentagem.toFixed(0)}%)\n\nRespostas corretas: 1-A, 2-B, 3-B${conquistaMensagem}`);
        }
    </script>

<script src="nav-tabs.js" defer></script>
<script src="{% static 'header-actions.js' %}" defer></script>
</body>

</html>
