<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar conta | Explore+</title>

{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}?v={% now 'U' %}">

</head>

<body>

<section class="login-page">
  <div class="light-login-shell">
    <div class="light-login-card">
      <div class="light-login-header">
        <div class="brand-badge" aria-label="Explore+ logo">
          <img src="{% static 'images/Logo.png' %}" alt="Logo Explore+" />
        </div>
        <h2>Criar conta</h2>
        <p>Começa a tua aventura científica.</p>
      </div>

      <form method="post" action="{% url 'signup' %}" class="light-login-form">
        {% csrf_token %}
        {% if erro %}<p class="form-error">{{ erro }}</p>{% endif %}

        <div class="form-group">
          <label for="nome">Nome de utilizador</label>
          <div class="input-shell">
            <input id="nome" name="username" type="text" placeholder="Nome de utilizador" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-shell">
            <input id="email" name="email" type="email" placeholder="Email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Palavra-passe</label>
          <div class="input-shell password-container">
            <input id="password" name="password" type="password" placeholder="Criar palavra-passe" required>
            <span id="olhoPassword" class="olho" role="button" tabindex="0" aria-label="Mostrar palavra-passe">
              <svg class="olho-icon-show" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="olho-icon-hide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmarPassword">Confirmar palavra-passe</label>
          <div class="input-shell password-container">
            <input id="confirmarPassword" name="confirmarPassword" type="password" placeholder="Confirmar palavra-passe" required>
            <span id="olhoConfirmar" class="olho" role="button" tabindex="0" aria-label="Mostrar palavra-passe">
              <svg class="olho-icon-show" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="olho-icon-hide" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </span>
          </div>
        </div>

        <button id="criarContaBtn" type="submit" class="login-button">Criar conta</button>
      </form>

      <div class="divider"><span>ou</span></div>

      <a href="{% url 'google_login' %}" class="social-button google-button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
          <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
          <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
          <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
        </svg>
        Continuar com Google
      </a>

      <p class="bottom-signup">
        Já tens conta?
        <a href="{% url 'login' %}">Entrar</a>
      </p>
    </div>
  </div>
</section>
<script src="{% static 'password-toggle.js' %}?v={% now 'U' %}"></script>
</body>

</html>
