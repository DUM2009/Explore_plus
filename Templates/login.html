{% load static %}
<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Explore+</title>
  <link rel="stylesheet" href="{% static 'style.css' %}?v={% now 'U' %}">
</head>

<body>

  <section class="login-page">
    <div class="login-illustration">
      <img src="{% static 'images/Estudante 1.png' %}" alt="Estudante a explorar a Explore+" />
    </div>
    <div class="light-login-shell">
      <div class="light-login-card">
        <div class="light-login-header">
          <div class="brand-badge" aria-label="Explore+ logo">
            <img src="{% static 'images/Logo.png' %}" alt="Logo Explore+" />
          </div>
          <h2>Continua a explorar!</h2>
          {% if erro %}
  <p style="color: #dc3545; font-weight: bold; text-align: center; margin-bottom: 15px;">{{ erro }}</p>
{% endif %}

          <p>Entra na tua conta</p>
        </div>

        <!-- 1. Garante que a abertura do formulário tem exatamente este método e ação -->
<form class="light-login-form" autocomplete="on" method="POST" action="{% url 'login' %}">
    {% csrf_token %} 
    
    <!-- 2. Linha para mostrar a mensagem de erro vermelha do Django caso erres a pass -->
    {% if erro %}
    <p style="color: red; font-weight: bold;">{{ erro }}</p>
    {% endif %}

    <div class="form-group">
        <label for="emailLogin">Email ou Utilizador</label>
        <div class="input-shell">
            <!-- 3. Garante que tem o atributo name="email" -->
            <input id="emailLogin" name="username" type="text" placeholder="Inserir email ou username" required />
        </div>
    </div>

    <div class="form-group">
        <div class="label-row">
            <label for="passwordLogin">Password</label>
        </div>
        <div class="input-shell">
            <!-- 4. Garante que tem o atributo name="password" -->
            <input id="passwordLogin" name="password" type="password" placeholder="••••••••" required />
        </div>
    </div>

    <!-- 5. O teu botão de submissão limpo e sem tags <a> à volta -->
    <button type="submit" class="login-button">Entrar</button>
</form>

        <div class="divider"><span>ou</span></div>

        <a href="{% url 'google_login' %}" class="social-button google-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
            <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
            <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
            <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
          </svg>
          Continuar com Google
        </a>

        <p class="bottom-signup">
          Não tens conta?
          <a href="{% url 'signup' %}">Criar conta</a>
        </p>
      </div>
    </div>
  </section>

 

</body>

</html>
