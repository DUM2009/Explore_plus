{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Code of Life | Explore+</title>
    
    <!-- CSS Externo -->
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'mission-styles.css' %}">
    

    <!-- CSS Interno (Movido para dentro do HEAD) -->
    <style>
        .guide-option.correct {
            background-color: #d4edda;
            border-color: #28a745;
        }

        .guide-option.incorrect {
            background-color: #f8d7da;
            border-color: #dc3545;
        }

        .guide-option:disabled {
            cursor: not-allowed;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">Explore+</div>
        <nav>
            <a href="{% url 'pagina_inicial' %}">Início</a>
            <a href="{% url 'index-missions' %}">Missões</a>
            <a href="{% url 'about' %}">Sobre</a>
            <a href="{% url 'perfil' %}">Perfil</a>
        </nav>
    </header>

    <!-- Main Mission Container -->
    <div class="mission-container">
        <!-- Progress Section -->
        <div class="mission-header">
            <div class="header-content">
                <a href="{% url 'index-missions' %}" class="back-button">
                    &larr; Voltar
                </a>
                <div class="mission-title-section">
                    <h1 id="missionTitle"></h1>
                    <p id="missionDescription"></p>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-info">
                    <span class="progress-label">Progresso</span>
                    <span class="progress-percent" id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="section-counter">
                    <span id="sectionCounter">0/6 Secções</span>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="mission-content">
            <!-- Sections Container -->
            <div class="sections-wrapper" id="sectionsWrapper"></div>

            <!-- Componente de Abas / Navegação (Posicionado dentro do conteúdo principal) -->
            <!-- From Uiverse.io by gharsh11032000 --> 
           
        </div>
    </div>

    <!-- XP Toast Notification -->
    <div class="xp-toast" id="xpToast">
        <span class="xp-icon">⭐</span>
        <span class="xp-text" id="xpText">+50 XP</span>
    </div>

    <!-- Correct Answer Animation -->
    <div class="correct-animation" id="correctAnimation">
        <div class="celebration">
            <div class="confetti">🎉</div>
            <div class="confetti">✨</div>
            <div class="confetti">🎊</div>
        </div>
    </div>
     

    <!-- Scripts -->
    <script>
        window.exploreCurrentUser = { uid: 'django-{{ request.user.id }}', email: '{{ request.user.email|escapejs }}' };
    </script>
    <script src="{% static 'mission-data-photosynthesis.js' %}" defer></script>
    <script>
        window.exploreProgressSyncUrl = '{% url "salvar-progresso-missao" %}';
        window.exploreCsrfToken = '{{ csrf_token }}';
    </script>
    <script src="{% static 'profile-xp.js' %}" defer></script>
    <script src="{% static 'mission.js' %}" defer></script>
    <script src="{% static 'nav-tabs.js' %}" defer></script>

</body>
</html>
