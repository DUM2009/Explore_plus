{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotossíntese | Explore+</title>
    <script>
        // Applied before the stylesheets paint, so switching pages never
        // flashes the wrong theme for a student who picked dark mode.
        (function () {
            try {
                if (localStorage.getItem('explore-theme') === 'dark') {
                    document.documentElement.classList.add('dark-mode');
                    document.documentElement.dataset.theme = 'dark';
                }
            } catch (error) {
                // Ignore storage access errors (private browsing) — the page
                // just falls back to light mode.
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}?v={% now 'U' %}">
    <link rel="stylesheet" href="{% static 'mission-styles.css' %}?v={% now 'U' %}">
</head>
<body class="shadcn-profile">
    <!-- Percurso screen: forest path of section circles, shown once per mission -->
    <div class="mission-path-screen" id="missionPathScreen" hidden></div>

    <!-- Main Mission Container: starts hidden (like #missionPathScreen above)
         so the old lesson-topbar chrome doesn't flash empty before mission.js
         runs on DOMContentLoaded and decides which of the two to show. -->
    <div class="mission-container" hidden>
        <div id="missionNotice" class="locked-message" style="display:none; margin-bottom:16px;"></div>

        <div class="mission-shell is-sidebar-collapsed">
            <!-- Sidebar: back link + mascot chat, persistent across every
                 section/screen. Starts collapsed — the floating mascot fab
                 below is what opens it. -->
            <aside class="mission-sidebar" id="missionSidebar">
                <!-- Mascot chat: replaces the section list here — a
                     permanent, always-open panel (no fab/toggle needed)
                     where the student can ask Kim about the current card. -->
                <div class="mascote-chat-panel" id="mascoteChatPanel">
                    <div class="mascote-chat-header">
                        <span>Fala com o Kim</span>
                        <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Esconder o chat">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M9 3v18"/></svg>
                        </button>
                    </div>
                    <div class="mascote-chat-messages" id="mascoteChatMessages">
                        <div class="mascote-chat-welcome" id="mascoteChatWelcome">
                            <video src="{% static 'Mascote a acenar.webm' %}" class="mascote-chat-welcome-video" autoplay loop muted playsinline></video>
                            <div class="mascote-chat-welcome-copy">
                                <p class="mascote-chat-welcome-greeting">Olá, {{ request.user.username }}!</p>
                                <h3 class="mascote-chat-welcome-title">Bem-vindo de volta! Como posso ajudar?</h3>
                                <p class="mascote-chat-welcome-subtitle">Estou aqui para te ajudar a estudar Biologia. Escolhe uma sugestão ou escreve a tua pergunta!</p>
                            </div>
                            <div class="mascote-chat-suggestions">
                                <button type="button" class="mascote-chat-suggestion" data-suggestion="Podes explicar-me este conceito de forma simples?">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
                                    Explicar um conceito
                                </button>
                                <button type="button" class="mascote-chat-suggestion" data-suggestion="Podes resumir a matéria desta unidade?">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                                    Resumir a matéria
                                </button>
                                <button type="button" class="mascote-chat-suggestion" data-suggestion="Ajuda-me a preparar-me para um teste.">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
                                    Preparar um teste
                                </button>
                                <button type="button" class="mascote-chat-suggestion" data-suggestion="Podes dar-me um exemplo prático?">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>
                                    Dar um exemplo
                                </button>
                                <button type="button" class="mascote-chat-suggestion" data-suggestion="Podes corrigir a minha resposta?">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
                                    Corrigir a resposta
                                </button>
                                <button type="button" class="mascote-chat-suggestion" data-suggestion="">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
                                    Mais
                                </button>
                            </div>
                        </div>
                    </div>
                    <form class="mascote-chat-form" id="mascoteChatForm">
                        <input type="text" class="mascote-chat-input" id="mascoteChatInput" placeholder="Escreve a tua pergunta..." autocomplete="off" maxlength="500">
                        <button type="submit" class="mascote-chat-send" id="mascoteChatSend" aria-label="Enviar">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                        </button>
                    </form>
                </div>
            </aside>

            <!-- Drag handle: lets the student widen/narrow the chat sidebar.
                 Only meaningful (and shown) while the sidebar is open. -->
            <div class="mission-sidebar-resize-handle" id="missionSidebarResizeHandle" role="separator" aria-orientation="vertical" aria-label="Redimensionar o painel do chat"></div>

            <div class="mission-main">
                <!-- Lesson chrome: mission title/progress, live XP/streak, theme -->
                <div class="lesson-topbar" id="lessonTopbar">
                    <button type="button" class="lesson-topbar-close" id="lessonTopbarClose" aria-label="Fechar e voltar às missões" hidden>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                    </button>
                    <div class="lesson-topbar-titles">
                        <span class="lesson-topbar-title" id="lessonTopbarTitle"></span>
                        <div class="lesson-progress-row">
                            <div class="lesson-progress-track" id="lessonProgressTrack">
                                <div class="lesson-progress-fill" id="lessonProgressFill"></div>
                            </div>
                            <span class="lesson-progress-percent" id="lessonProgressPercent"></span>
                        </div>
                    </div>
                    <div class="lesson-topbar-actions">
                        <div class="lesson-stats" id="lessonStats"></div>
                        <button type="button" class="lesson-theme-toggle" id="lessonThemeToggle" aria-label="Alternar modo claro/escuro">
                            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Content Area -->
                <div class="mission-content">
                    <!-- Sections Container -->
                    <div class="sections-wrapper" id="sectionsWrapper"></div>
                </div>

                <div class="mission-fact-banner" id="missionFactBanner"></div>
            </div>
        </div>
    </div>

    <!-- Floating mascot button: opens the chat sidebar. Hidden once the
         chat is open (see the is-sidebar-collapsed toggle in mission.js). -->
    <button type="button" class="mascot-chat-fab" id="mascotChatFab" aria-label="Falar com o Kim">
        <video src="{% static 'Mascote a acenar.webm' %}" autoplay loop muted playsinline></video>
    </button>

    <!-- Kim chiming in on his own every so often, so he reads as an active companion -->
    <div class="lesson-ambient-tip" id="lessonAmbientTip" hidden>
        <span id="lessonAmbientTipText"></span>
    </div>

    <!-- XP Toast Notification -->
    <div class="xp-toast" id="xpToast">
        <span class="xp-icon">⭐</span>
        <span class="xp-text" id="xpText">+50 XP</span>
    </div>

    <!-- Dictionary ("livro de explorador") Toast Notification -->
    <div class="dictionary-toast" id="dictionaryToast">
        <span class="dictionary-toast-icon">📖</span>
        <span class="dictionary-toast-text" id="dictionaryToastText"></span>
    </div>

    <!-- Correct Answer Animation -->
    <div class="correct-animation" id="correctAnimation">
        <div class="celebration">
            <div class="confetti">🎉</div>
            <div class="confetti">✨</div>
            <div class="confetti">🎊</div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        window.exploreCurrentUser = { uid: 'django-{{ request.user.id }}', email: '{{ request.user.email|escapejs }}' };
        window.exploreUserId = '{{ request.user.id|escapejs }}';
        window.exploreProgressSyncUrl = '{% url "salvar-progresso-missao" %}';
        window.exploreCsrfToken = '{{ csrf_token }}';
        window.exploreAvatarOptions = {
            biology: '{% static "images/Mascote Explore+ Biology Avatar.png" %}',
            geology: '{% static "images/Mascote Explore+ Geology Avatar.png" %}',
            chemistry: '{% static "images/Mascote Chemistry Avatar.png" %}',
        };
        window.exploreMissionsIndexUrl = '{% url "index-missions" %}';
        window.exploreMascoteChatUrl = '{% url "mascote-chat" %}';
        window.exploreMascotWaveVideoUrl = '{% static "Mascote a acenar.webm" %}';
        window.explorePaginaInicialUrl = '{% url "pagina_inicial" %}';
        window.exploreAboutUrl = '{% url "about" %}';
        window.explorePerfilUrl = '{% url "perfil" %}';
        window.exploreLogoutUrl = '{% url "logout" %}';
        window.exploreLogoUrl = '{% static "images/Logo.png" %}';
        window.exploreUsername = '{{ request.user.username|escapejs }}';
        window.explorePlano = '{{ perfil.plano|escapejs }}';
        window.exploreTestesUrl = '{% url "Testes" %}';
        window.exploreFotossinteseTesteUrl = '{% url "teste-fotossintese" "fotossintese" %}';
        window.exploreExamesUrl = '{% url "exames" %}';
        window.exploreBibliotecaUrl = '{% url "biblioteca" %}';
        window.exploreResumosUrl = '{% url "Resumos" %}';
        window.exploreSuperExploreUrl = '{% url "superexplore" %}';
        window.exploreConfiguracoesUrl = '{% url "Configurações" %}';
    </script>
    <script src="{% static 'avatar-selector.js' %}"></script>
    <script>
        // The mascot shown in dialogs/curiosity overlays follows whatever
        // avatar the student picked on the profile page — same stored id,
        // resolved against this page's own static paths above.
        window.exploreMascotImageUrl = window.ExploreAvatar.getSelectedAvatarUrl();
    </script>
    <script src="{% static 'mission-data-photosynthesis.js' %}?v={% now 'U' %}"></script>
<script src="{% static 'profile-xp.js' %}?v={% now 'U' %}"></script>
<script src="{% static 'mission.js' %}?v={% now 'U' %}"></script>
    <script>
        // Override startFinalQuiz to redirect to the gold test page instead of in-page quiz
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('locked') === 'gold') {
                const notice = document.getElementById('missionNotice');
                if (notice) {
                    notice.style.display = 'block';
                    notice.textContent = '🔒 Termina todas as etapas da missão para desbloquear o Teste de Ouro.';
                }
            }

            const applyGoldTestOverride = () => {
                if (typeof missionSystem === 'undefined' || !missionData.goldTestUrl) {
                    return false;
                }

                missionSystem.startFinalQuiz = function () {
                    const message = 'Ganhaste o emblema de prata 🥈\nQueres tentar ganhar o emblema de ouro? Resolve o teste final do capítulo (20 perguntas) e consegue 17 ou mais valores.';
                    const proceed = window.confirm(message);

                    if (proceed) {
                        sessionStorage.setItem('allow_goldtest_photosynthesis', '1');
                        window.location.href = missionData.goldTestUrl;
                    }
                };

                return true;
            };

            if (applyGoldTestOverride()) {
                return;
            }

            window.addEventListener('explore:auth-changed', applyGoldTestOverride, { once: true });

            let attempts = 0;
            const attachTimer = setInterval(() => {
                attempts += 1;
                if (applyGoldTestOverride() || attempts > 20) {
                    clearInterval(attachTimer);
                }
            }, 100);
        });
    </script>

<script src="{% static 'nav-tabs.js' %}" defer></script>
<script src="{% static 'header-actions.js' %}" defer></script>
</body>
</html>
