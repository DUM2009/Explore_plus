{% load static %}
<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Explore+</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <header>
        <div class="logo">
            <img src="{% static 'images/Logo.png' %}" alt="Logotipo Explore+">
        </div>
        <nav>
            <a href="{% url 'pagina_inicial' %}">Início</a>
            <a href="{% url 'index-missions' %}">Missões</a>
            <a href="{% url 'about' %}">Sobre</a>
            <a href="{% url 'login' %}">Login</a>
        </nav>
    </header>
    <section class="dashboard">
        <div class="perfil-card">
            <div class="avatar">📊</div>
            <h2>Dashboard</h2>
            <p>Bem-vindo ao teu painel de controle!</p>
        </div>

        <div class="xp-card">
            <h2>Estatísticas</h2>
            <p>Acompanha o teu progresso</p>
            <div class="barra">
                <div class="progresso" style="width: 45%;"></div>
            </div>
            <p style="margin-top: 15px;">45 / 100 Pontos</p>
        </div>

        <div class="conquistas-card">
            <h2>🎯 Metas</h2>
            <p>Define os teus objetivos de aprendizagem</p>
        </div>

        <div class="acoes-card">
            <h2>📚 Ações</h2>
            <button onclick="window.location.href='{% url 'index-missions' %}'">Ver Missões</button>
            <button onclick="window.location.href='{% url 'perfil' %}'">Ir para Perfil</button>
        </div>
    </section>

<script src="{% static 'nav-tabs.js' %}" defer></script>
</body>

</html>
